services:
  db:
    image: postgres:16
    container_name: crewbrain-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crewbrain
    ports:
      - "5432:5432"
    volumes:
      - crewbrain-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  crewbrain-pgdata:
